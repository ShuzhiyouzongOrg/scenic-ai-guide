name: Build desktop artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.1"
  DESKTOP_VERSION: "0.2.0"

jobs:
  build-web:
    name: Build and test web application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run map guide tests
        working-directory: web
        run: pnpm test

      - name: Build web application
        working-directory: web
        env:
          VITE_XF_AVATAR_APPID: ${{ secrets.XFYUN_APP_ID }}
          VITE_XF_AVATAR_APIKEY: ${{ secrets.XFYUN_API_KEY }}
          VITE_XF_AVATAR_APISECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: pnpm build

      - name: Verify avatar credentials in web build
        working-directory: desktop
        env:
          VITE_XF_AVATAR_APPID: ${{ secrets.XFYUN_APP_ID }}
          VITE_XF_AVATAR_APIKEY: ${{ secrets.XFYUN_API_KEY }}
          VITE_XF_AVATAR_APISECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: node scripts/verify-web-build.mjs ../web/dist

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: shuzhiyouzong-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  package-desktop:
    name: Package ${{ matrix.label }}
    needs: build-web
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            command: npm run dist:win
            artifact: shuzhiyouzong-windows-x64
            file_extensions: ".exe"
            expected_arch: x64
          - label: macOS x64
            runner: macos-15-intel
            command: npm run dist:mac:x64
            artifact: shuzhiyouzong-macos-x64
            file_extensions: ".dmg"
            expected_arch: x86_64
          - label: macOS arm64
            runner: macos-15
            command: npm run dist:mac:arm64
            artifact: shuzhiyouzong-macos-arm64
            file_extensions: ".dmg"
            expected_arch: arm64
          - label: Linux x64
            runner: ubuntu-22.04
            command: npm run dist:linux
            artifact: shuzhiyouzong-linux-x64
            file_extensions: ".AppImage .deb"
            expected_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify desktop release version
        working-directory: desktop
        run: |
          node -e "const { readFileSync } = require('node:fs'); const version = JSON.parse(readFileSync('package.json', 'utf8')).version; if (version !== process.env.DESKTOP_VERSION) { throw new Error('desktop/package.json version ' + version + ' does not match DESKTOP_VERSION ' + process.env.DESKTOP_VERSION); }"

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: shuzhiyouzong-web-dist
          path: web/dist

      - name: Run desktop runtime tests
        working-directory: desktop
        run: npm test

      - name: Package desktop application
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEMO_MODE: "true"
          LLM_PROVIDER: "openai"
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com/v1"
          LLM_MODEL: "deepseek-chat"
          LLM_TIMEOUT_MS: "20000"
          LLM_MAX_RETRIES: "2"
          LLM_TEMPERATURE: "0.4"
          ASR_PROVIDER: "mock"
          TTS_PROVIDER: "xfyun"
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
          XFYUN_TTS_VOICE: "x4_xiaoyan"
          DEFAULT_AVATAR_ID: "cnrmkf0e2000000006"
          DEFAULT_AVATAR_VCN: "x6_jingqudaolannvsheng_mini"
        run: ${{ matrix.command }}

      - name: Verify packaged desktop runtime
        working-directory: desktop
        run: node scripts/verify-unpacked-package.mjs dist

      - name: Verify Windows installer contents
        if: matrix.label == 'Windows x64'
        working-directory: desktop
        run: node scripts/verify-windows-package.mjs dist

      - name: Smoke test Windows installer runtime
        if: matrix.label == 'Windows x64'
        working-directory: desktop
        run: node scripts/smoke-windows-package.mjs dist

      - name: Verify macOS disk image contents
        if: startsWith(matrix.label, 'macOS')
        working-directory: desktop
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: node scripts/verify-macos-package.mjs dist

      - name: Verify Linux compatibility
        if: matrix.label == 'Linux x64'
        working-directory: desktop
        run: node scripts/verify-linux-package.mjs dist

      - name: Create checksums
        working-directory: desktop/dist
        env:
          FILE_EXTENSIONS: ${{ matrix.file_extensions }}
        run: |
          node ../scripts/create-checksums.mjs $FILE_EXTENSIONS

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false
