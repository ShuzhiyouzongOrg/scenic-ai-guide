<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<style>
			/* HBuilderX 5.24 already reserves tab and safe-area height on the H5 page wrapper. */
			[data-sg-keyboard]:focus-visible { outline: 2px solid var(--sg-primary); outline-offset: -3px; }
			#app uni-app.uni-app--showtabbar uni-page-body::after { display: none; }
		</style>
		<script>
			var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
				CSS.supports('top: constant(a)'))
			document.write(
				'<meta name="viewport" content="width=device-width, initial-scale=1.0' +
				(coverSupport ? ', viewport-fit=cover' : '') + '" />')
		</script>
		<title>数智游踪</title>
		<!--preload-links-->
		<!--app-context-->
	</head>
	<body>
		<div id="app"><!--app-html--></div>
		<script type="module" src="/main"></script>
	</body>
</html>
