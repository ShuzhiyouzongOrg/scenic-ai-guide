# Public API vhost for the uni-app x visitor application. It is isolated from
# the www/docs vhosts and only proxies visitor API/runtime paths to Node.
server {
    listen 80;
    listen [::]:80;
    server_name api.shuzhiyouzong.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.shuzhiyouzong.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shuzhiyouzong.cn;

    ssl_certificate     /etc/letsencrypt/live/api.shuzhiyouzong.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shuzhiyouzong.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $scenic_connection_upgrade;

        # Required by /api/chat/stream and harmless for normal JSON and file
        # upload/download endpoints.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        send_timeout 300s;
        add_header X-Accel-Buffering no always;
    }

    # Controlled iFlytek avatar runtime. It is a same-origin, GET/HEAD-only
    # WebView page; all long-lived vendor credentials remain in the Node
    # service and clients receive only a short-lived signed session.
    location = /digital-human {
        return 308 /digital-human/;
    }

    location ^~ /digital-human/ {
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Controlled first-party Live2D canvas runtime and model assets. This is
    # independent from the main website and contains no provider credentials.
    location = /live2d {
        return 308 /live2d/;
    }

    location ^~ /live2d/ {
        limit_except GET HEAD { deny all; }

        proxy_pass http://127.0.0.1:5178;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Do not accidentally serve the main website from the API hostname.
    location / {
        default_type application/json;
        return 404 '{"ok":false,"error":{"code":"NOT_FOUND","message":"API endpoint not found."}}';
    }
}
