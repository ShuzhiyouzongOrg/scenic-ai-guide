# Temporary HTTP-only vhost used to request the first Let's Encrypt
# certificate. Replace it with api.shuzhiyouzong.cn.conf after Certbot succeeds.
server {
    listen 80;
    listen [::]:80;
    server_name api.shuzhiyouzong.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.shuzhiyouzong.cn$request_uri;
    }
}
